[package]
name = "xlsx-pdf-core"
version = "0.1.0"
edition = "2021"
description = "Convert XLSX workbooks to PDF in the browser."
repository = "https://github.com/SyahrulBhudiF/yohaku"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calamine = { version = "0.38", default-features = false }
encoding_rs = "0.8"
flate2 = "1"
pdf-writer = "0.15"
soa-rs = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
