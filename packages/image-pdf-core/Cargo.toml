[package]
name = "image-pdf-core"
version = "0.1.0"
edition = "2021"
description = "Build image-only PDFs from PNG and JPEG bytes."
repository = "https://github.com/SyahrulBhudiF/yohaku"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1"
jpeg-decoder = "0.3"
pdf-writer = "0.15"
png = "0.17"
soa-rs = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
