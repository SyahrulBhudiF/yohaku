[package]
name = "background-removal-core"
version = "0.1.0"
edition = "2021"
description = "Fast non-AI background removal for uniform studio backgrounds."
repository = "https://github.com/SyahrulBhudiF/yohaku"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
