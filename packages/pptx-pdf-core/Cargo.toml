[package]
name = "pptx-pdf-core"
version = "0.1.0"
edition = "2021"
description = "Render PPTX presentations to PDF in the browser."
repository = "https://github.com/SyahrulBhudiF/yohaku"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8"
flate2 = "1"
jpeg-decoder = "0.3"
pdf-writer = "0.15"
png = "0.17"
roxmltree = "0.20"
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
