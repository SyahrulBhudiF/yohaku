[package]
name = "word-pdf-core"
version = "0.1.0"
edition = "2024"
description = "Render Word documents to PDF in the browser."
repository = "https://github.com/SyahrulBhudiF/yohaku"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jubarte-render = "=0.20.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
